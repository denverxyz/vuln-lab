# vsftpd 2.3.4 — backdoored build (USER ending in ":)" -> shell on port 6200).
#
# one_process_model=YES is REQUIRED for the backdoor shell to work: it keeps the
# pre-login process unchrooted, so the backdoor's execl("/bin/sh") can find a real
# shell. With the two-process model vsftpd chroots pre-login into secure_chroot_dir
# (empty), execl fails, and 6200 accepts but the shell dies with no output.
# This forbids local_enable=YES — so FTP here is backdoor + anonymous only; do
# credential brute-force against SSH/MySQL instead (net-brute defaults to mysql).
listen=YES
listen_ipv6=NO

anonymous_enable=YES
one_process_model=YES
local_enable=NO

# Anonymous upload (also a writable recon target)
write_enable=YES
anon_upload_enable=YES
anon_mkdir_write_enable=YES
anon_other_write_enable=YES
anon_umask=022

max_clients=100
max_per_ip=20

xferlog_enable=YES
log_ftp_protocol=YES

pasv_enable=YES
pasv_min_port=21100
pasv_max_port=21110

# anon_root=/ makes the one-process chroot a no-op so the backdoor shell can
# reach the real /bin/sh (and is a juicy info-disclosure surface for recon too).
anon_root=/
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=ftp

# Expose version for recon
ftpd_banner=Welcome to network-lab FTP (vsftpd 2.3.4)
