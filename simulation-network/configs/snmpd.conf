# network-lab SNMP — intentionally weak & chatty (enumeration target)

# Listen on all interfaces (Debian default binds localhost only).
# NOTE: must be udp:0.0.0.0:161 — "udp:161" is parsed as address "161", not port.
agentaddress udp:0.0.0.0:161

# Expose the whole MIB tree
view all included .1 80

# Weak community strings (classic): public = read-only, private = read-write
rocommunity public  default -V all
rwcommunity private default -V all

# Identity / recon info (juicy hints for the attacker)
sysLocation DC1 Rack-14U / Mgmt-VLAN 10.10.10.0/24 / NOC netadmin@corp.local / core creds in KeePass 'core-rtr01'
# sysContact left unset on purpose so snmpset via the 'private' RW community can tamper it
sysName     net-lab-core01
sysServices 76

# Expose command output + secrets via NET-SNMP-EXTEND-MIB (very chatty on snmpwalk)
extend osinfo   /bin/uname -a
extend whoami   /usr/bin/id
extend passwd   /bin/cat /etc/passwd
extend routes   /bin/cat /proc/net/route
extend secrets  /bin/cat /opt/snmp-secrets.txt
