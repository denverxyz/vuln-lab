events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Vuln: Server version exposed
    server_tokens on;

    # Custom log format - capture full request detail untuk attack detection
    log_format attack_log '$time_iso8601 | '
                          'IP=$remote_addr | '
                          'METHOD=$request_method | '
                          'URI=$request_uri | '
                          'STATUS=$status | '
                          'BYTES=$body_bytes_sent | '
                          'REF=$http_referer | '
                          'UA="$http_user_agent" | '
                          'BODY=$request_body';

    log_format json_log escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"user_agent":"$http_user_agent",'
        '"request_body":"$request_body"'
    '}';

    # HTTP - Port 80
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        # Log ke file berasingan untuk analysis
        access_log /var/log/nginx/access.log attack_log;
        access_log /var/log/vuln-lab/http_json.log json_log;
        error_log  /var/log/nginx/error.log warn;

        # Vuln: No rate limiting
        location /login.php {
            access_log /var/log/vuln-lab/login_attempts.log attack_log;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Vuln: Directory listing
        location /uploads/ {
            autoindex on;
            access_log /var/log/vuln-lab/uploads_access.log attack_log;
        }

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        # Vuln: Sensitive files accessible
        location ~ \.(sql|log|bak|env)$ {
            access_log /var/log/vuln-lab/sensitive_access.log attack_log;
            allow all;
        }
    }

    # HTTPS - Port 443
    server {
        listen 443 ssl;
        server_name _;
        root /var/www/html;
        index index.php index.html;

        access_log /var/log/nginx/ssl_access.log attack_log;
        access_log /var/log/vuln-lab/https_json.log json_log;
        error_log  /var/log/nginx/ssl_error.log warn;

        # Weak SSL/TLS scenario removed — modern TLS only (1.2/1.3, strong ciphers).
        ssl_certificate     /etc/ssl/vuln-lab/cert.pem;
        ssl_certificate_key /etc/ssl/vuln-lab/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5:!RC4:!3DES;
        ssl_prefer_server_ciphers on;

        # Vuln: Tiada security headers
        # Takde X-Frame-Options
        # Takde Content-Security-Policy
        # Takde X-XSS-Protection
        # Takde HSTS

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location /login.php {
            access_log /var/log/vuln-lab/login_attempts.log attack_log;
            fastcgi_pass unix:/run/php/php8.1-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }
}
